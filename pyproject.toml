[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocanvas"
version = "2.0.0.dev0"
description = "Independent Canvas acquisition, media, transcription and slide processing"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "aiohttp>=3.9", "PyYAML>=6.0", "psutil>=5.9", "tzdata; platform_system == 'Windows'"]

[project.optional-dependencies]
asr = ["numpy", "torch", "qwen-asr"]
slides = ["numpy", "opencv-python"]

[project.scripts]
autocanvas = "autocanvas.cli:main"
dashboard-gateway = "dashboard_gateway.__main__:main"
homework-service = "homework_service.__main__:main"

[tool.setuptools.packages.find]
include = ["autocanvas*", "homework_service*", "dashboard_gateway*"]
